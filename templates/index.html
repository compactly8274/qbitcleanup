<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>qBit Cleanup</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand">
        <span class="brand-icon">&#128465;</span>
        <span class="brand-name">qBit Cleanup</span>
      </div>
      <div style="display:flex;align-items:center;gap:0.5rem">
        <span class="jobs-indicator" id="jobs-indicator" style="display:none" onclick="toggleJobsPanel(event)"></span>
        <div class="status-pill" id="status-pill">
          <span class="status-dot" id="status-dot"></span>
          <span id="status-text">Connecting…</span>
        </div>
      </div>
    </div>
    <div class="disk-bar" id="disk-bar"></div>
  </header>

  <nav class="tab-bar">
    <button class="tab active" data-tab="orphans">
      Orphaned <span class="badge" id="badge-orphans">0</span>
    </button>
    <button class="tab" data-tab="trash">
      Trash <span class="badge" id="badge-trash">0</span>
    </button>
    <button class="tab" data-tab="ignored">
      Ignored <span class="badge" id="badge-ignored">0</span>
    </button>
  </nav>

  <main>
    <!-- ORPHANS -->
    <section id="view-orphans" class="view active">
      <div class="toolbar">
        <label class="check-wrap" title="Select all">
          <input type="checkbox" id="check-all-orphans" onchange="toggleSelectAll('orphans')">
        </label>
        <button class="btn btn-warning" onclick="moveAll()">Move All</button>
        <button class="btn btn-secondary" onclick="loadOrphans(true)">Re-scan</button>
        <select class="sort-select" id="orphan-sort" onchange="renderOrphans()">
          <option value="size-desc">Size ↓</option>
          <option value="size-asc">Size ↑</option>
          <option value="accessed-desc">Accessed ↓</option>
          <option value="accessed-asc">Accessed ↑</option>
        </select>
      </div>
      <div class="filter-bar">
        <input class="search-input" id="search-orphans" type="search" placeholder="Search files…" oninput="renderOrphans()">
        <select class="sort-select" id="age-filter" onchange="renderOrphans()">
          <option value="0">Any age</option>
          <option value="7">7+ days old</option>
          <option value="30">30+ days old</option>
          <option value="90">90+ days old</option>
          <option value="365">1+ year old</option>
        </select>
        <button class="btn btn-secondary btn-sm" id="btn-group" onclick="toggleGrouping()">⊞ Group</button>
      </div>
      <div class="list-container" id="orphans-list"></div>
    </section>

    <!-- TRASH -->
    <section id="view-trash" class="view">
      <div class="toolbar">
        <label class="check-wrap" title="Select all">
          <input type="checkbox" id="check-all-trash" onchange="toggleSelectAll('trash')">
        </label>
        <button class="btn btn-success" onclick="restoreAll()">Restore All</button>
        <button class="btn btn-danger" onclick="deleteAll()">Delete All</button>
        <button class="btn btn-secondary" onclick="loadTrash()">Refresh</button>
        <select class="sort-select" id="trash-sort" onchange="renderTrash()">
          <option value="size-desc">Size ↓</option>
          <option value="size-asc">Size ↑</option>
          <option value="accessed-desc">Accessed ↓</option>
          <option value="accessed-asc">Accessed ↑</option>
        </select>
      </div>
      <div class="filter-bar">
        <input class="search-input" id="search-trash" type="search" placeholder="Search files…" oninput="renderTrash()">
      </div>
      <div class="list-container" id="trash-list"></div>
    </section>

    <!-- IGNORED -->
    <section id="view-ignored" class="view">
      <div class="toolbar">
        <span class="toolbar-label">These paths are excluded from all scans.</span>
      </div>
      <div class="list-container" id="ignored-list"></div>
    </section>
  </main>

  <!-- SELECTION BAR -->
  <div class="selection-bar" id="selection-bar">
    <span class="sel-count" id="sel-count"></span>
    <div class="sel-actions" id="sel-actions"></div>
    <button class="btn btn-ghost btn-sm" onclick="clearSelection()">✕ Clear</button>
  </div>

  <!-- MODAL -->
  <div class="modal-backdrop" id="modal-backdrop" onclick="closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-title" id="modal-title">Confirm</div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-danger" id="modal-confirm-btn">Confirm</button>
      </div>
    </div>
  </div>

  <!-- JOBS PANEL -->
  <div class="jobs-panel" id="jobs-panel" style="display:none">
    <div class="jobs-panel-title">Active jobs</div>
    <div id="jobs-panel-list"></div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="/static/app.js"></script>
</body>
</html>
