services:
  qbit-cleanup:
    image: ghcr.io/compactly8274/qbit-cleanup:latest
    build: .
    network_mode: host   # shares host network so qBittorrent whitelist sees LAN IP, not Docker bridge
    environment:
      - QBIT_HOST=http://localhost
      - QBIT_PORT=8080
      - QBIT_USERNAME=admin
      - QBIT_PASSWORD=adminadmin
      - DOWNLOADS_DIR=/downloads
      - TRASH_DIR=/downloads/.qbit-trash
    volumes:
      - /your/downloads:/downloads
    restart: unless-stopped
    # app listens on host port 5000 — no ports: mapping needed with network_mode: host
