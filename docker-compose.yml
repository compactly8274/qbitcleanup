services:
  qbit-cleanup:
    image: ghcr.io/compactly8274/qbit-cleanup:latest
    build: .
    network_mode: host
    environment:
      - QBIT_HOST=http://localhost
      - QBIT_PORT=8080
      - QBIT_API_KEY=your_api_key_here
      # Fallback for qBittorrent < 5.0 (remove if using API key)
      #- QBIT_USERNAME=admin
      #- QBIT_PASSWORD=adminadmin
      - DOWNLOADS_DIR=/downloads
      - TRASH_DIR=/downloads/.qbit-trash
      - MIN_ORPHAN_AGE_DAYS=0      # skip files modified within this many days (0 = off)
      - AUTO_TRASH_DAYS=0          # auto-move to trash after N days orphaned (0 = off)
      - WEBHOOK_URL=               # POST here when new orphans found (leave blank to disable)
    volumes:
      - /your/downloads:/downloads
    restart: unless-stopped
